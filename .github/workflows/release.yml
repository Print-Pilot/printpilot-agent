name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: make release checksums
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/printpilot-agent-linux-amd64
            dist/printpilot-agent-linux-amd64.sha256
            dist/printpilot-agent-linux-386
            dist/printpilot-agent-linux-386.sha256
            dist/printpilot-agent-linux-arm
            dist/printpilot-agent-linux-arm.sha256
            dist/printpilot-agent-linux-arm64
            dist/printpilot-agent-linux-arm64.sha256
            deploy/install.sh
