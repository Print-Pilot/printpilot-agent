# printpilot-agent configuration example
# Copy this file to agent-config.yaml and fill in your values.
# The real agent-config.yaml must never be committed (see .gitignore).

# URL del hub (WebSocket seguro saliente). Ejemplos:
#   wss://hub.tudominio.com/ws
#   ws://localhost:8080/ws   (desarrollo local)
hub_url: wss://hub.example.com/ws

# Token único de autenticación por impresora.
# Se envía al hub durante el handshake. NO lo dejes vacío en producción.
token: ""

# URL del websocket de Moonraker, que corre en la misma máquina.
moonraker_url: ws://localhost:7125/websocket

# Identificador único de la impresora (ej. "prusa-mk3s-sala", "ender3-taller").
printer_id: ""

# Intervalo de envío de heartbeats al hub, en segundos (default 30).
heartbeat_interval_seconds: 30

# Archivo de log (opcional). Si se setea, se escribe a archivo con rotación
# además de consola. Vacío = solo consola.
log_file: "/tmp/printpilot-agent.log"

# Nivel de log: debug | info | warn | error (default info).
log_level: "info"

# Puerto del proxy local compatible con Spoolman (default 8001). Moonraker
# debe apuntar su config [spoolman] server: a http://localhost:{puerto} para
# que el agente reciba y reenvíe el consumo de filamento al hub. 0 = deshabilitado.
spoolman_proxy_port: 8001

# --- WebRTC (cámara en vivo) ---
# URL base de go2rtc corriendo en la misma máquina (default de go2rtc: 1984).
# El agente actúa de intermediario transparente de señalización (WHEP) entre
# el hub y go2rtc; el video fluye P2P navegador <-> go2rtc. Vacío = streaming
# deshabilitado. En go2rtc.yaml configurá la fuente de la cámara con
# on_demand: true (go2rtc solo abre la cámara mientras haya un viewer).
go2rtc_url: ""

# Stream de go2rtc a servir cuando el panel pide camera_id "default" (MVP de
# una sola cámara). Si lo dejás vacío, el camera_id del offer se usa como
# nombre de stream (es decir, go2rtc debería tener un stream llamado "default").
# Ej: camera_stream: "camara1"
camera_stream: ""

# Timeout de negociación WebRTC en segundos (default 15). Una sesión que no se
# completa en este tiempo se considera muerta y se cierra. La limpieza del peer
# en go2rtc la hace go2rtc solo (se cierra al cerrarse la conexión del navegador).
webrtc_timeout_seconds: 15